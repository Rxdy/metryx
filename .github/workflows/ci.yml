name: CI

on:
  # Tests : sur chaque PR, et appelés par images.yml avant le build qui suit une fusion dans dev
  pull_request:
  workflow_call:

jobs:
  quality:
    name: quality (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [front, back]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
